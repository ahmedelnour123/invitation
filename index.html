<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#EEF1F2">

  <title>دعوة زفاف خضر وأمل</title>
  <meta name="description" content="يسرّنا دعوتكم لحضور حفل زفاف خضر وأمل — حبابكم عشرة">

       https:// links).

  <link rel="canonical" href="https://khidir-amal.ahmedelnour.com/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ar_SA">
  <meta property="og:site_name" content="دعوة زفاف خضر وأمل">
  <meta property="og:title" content="دعوة زفاف خضر وأمل">
  <meta property="og:description" content="يسرّنا دعوتكم لحضور حفل زفاف خضر وأمل — حبابكم عشرة">
  <meta property="og:url" content="https://khidir-amal.ahmedelnour.com/">
  <meta property="og:image" content="https://khidir-amal.ahmedelnour.com/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="دعوة زفاف خضر وأمل">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="دعوة زفاف خضر وأمل">
  <meta name="twitter:description" content="يسرّنا دعوتكم لحضور حفل زفاف خضر وأمل — حبابكم عشرة">
  <meta name="twitter:image" content="https://khidir-amal.ahmedelnour.com/og-image.jpg">
  <meta name="twitter:image:alt" content="دعوة زفاف خضر وأمل">

  <link rel="preload" as="image" href="assets/top.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=Gulzar&display=swap" rel="stylesheet">
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/xb-shafigh-bold.woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script>
    document.documentElement.classList.add('js');
    // always start at the top on (re)load, before anything is drawn,
    // so the page never jumps when the curtains open
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);
  </script>
</head>
<body class="is-locked">

  <!-- soft watercolour wash behind everything (a blurred copy of the card art) -->
  <div class="wash" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>

  <!-- ===== Opening: sheer curtains that draw open ===== -->
  <div class="intro" id="intro" role="button" tabindex="0" aria-label="افتح الدعوة" data-duration="2100">
    <div class="curtain curtain--right" aria-hidden="true"></div>
    <div class="curtain curtain--left" aria-hidden="true"></div>
    <div class="intro__content">
      <p class="intro__names">
        <span data-field="groomName">خضر</span>
        <img class="intro__waw" src="assets/waw.webp" alt="و" width="512" height="463">
        <span data-field="brideName">أمل</span>
      </p>
      <img class="intro__flourish" src="assets/flourish.svg" alt="" width="1890" height="139">
      <p class="intro__hint" data-video-hide>اضغط لفتح الدعوة</p>
    </div>
  </div>

  <!-- ===== Invitation =====
       Video attributes (used only by Tools/make-video.mjs, no effect on the site):
         data-video-scene="name"  → shown alone as one scene, in page order
         data-video-hold="ms"     → how long the scene stays on screen
         data-video-hide          → hidden in the video (buttons, tap hint) -->
  <main class="page">

    <!-- First page: the top of the Canva design (chandelier, flowers, curtains,
         the pillars' top halves) with the verse and opening words centred.
         The text keeps its Canva sizes and spacing (units of the 1080-wide
         Canva page — see styles.css). --i = fade-in order after the curtains open.
         The pillars then run down both sides of the page (.page::before/::after)
         and the grass, cloth and leaves close the last page (.ground). -->
    <header class="card" data-video-scene="card" data-video-hold="7000">
      <img class="card__art" src="assets/top.webp" alt="" width="1440" height="1547" fetchpriority="high">
      <div class="card__content">
        <p class="t c t-verse" style="--l:290.87;--t:0;--w:524.25;--h:61.42;--fs:24.72;--lh:30.71;--i:0" data-field="verse"></p>
        <p class="t c t-verse" style="--l:295.27;--t:45.4;--w:121.34;--h:16.03;--fs:14.03;--lh:16.03;--i:0" data-field="verseRef"></p>
        <div class="t c t-intro" style="--l:210.55;--t:105.14;--w:690.77;--h:165.84;--fs:30.79;--lh:41.46;--i:1" data-field="intro"></div>
      </div>
    </header>

    <!-- ===== Below the card ===== -->
    <div class="more">

      <!-- Host families (full names) -->
      <section class="section hosts" data-video-scene="families" data-video-hold="5500">
        <p class="s-label reveal" data-field="hostsLabel"></p>
        <ul class="hosts__list reveal" data-field="families"></ul>
        <p class="hosts__line reveal" data-field="invitationLine"></p>
        <img class="flourish reveal" src="assets/flourish.svg" alt="" width="1890" height="139">
        <div class="hosts__couple reveal">
          <p class="hosts__person"><small data-field="groomTitle"></small> <span data-field="groomFullName"></span></p>
          <img class="hosts__waw" src="assets/waw.webp" alt="و" width="512" height="463">
          <p class="hosts__person"><small data-field="brideTitle"></small> <span data-field="brideFullName"></span></p>
        </div>
        <img class="flourish reveal" src="assets/flourish.svg" alt="" width="1890" height="139">
      </section>

      <!-- Date -->
      <section class="section info" id="when" data-video-scene="date" data-video-hold="4000">
        <img class="info__icon reveal" src="assets/icon-calendar.svg" alt="" width="60" height="64">
        <h2 class="s-title reveal">الموعد</h2>
        <p class="info__main reveal" data-field="weekdayDate"></p>
        <p class="info__meta reveal" data-field="dateHijri"></p>
        <p class="info__meta reveal" data-field="timeLong"></p>
        <div class="actions reveal" data-video-hide>
          <a class="btn" id="gcalBtn" href="#" target="_blank" rel="noopener">أضف إلى تقويم Google</a>
          <button class="btn btn--ghost" id="icsBtn" type="button">أضف إلى تقويم الجوال</button>
        </div>
      </section>

      <!-- Venue -->
      <section class="section info" id="where" data-video-scene="venue" data-video-hold="4000">
        <img class="info__icon reveal" src="assets/icon-pin.svg" alt="" width="60" height="64">
        <h2 class="s-title reveal">المكان</h2>
        <p class="info__main reveal" data-field="venueName"></p>
        <p class="info__meta reveal" data-field="venueDescription"></p>
        <p class="info__meta reveal" data-field="venuePlace"></p>
        <div class="actions reveal" data-video-hide>
          <a class="btn" id="mapBtn" href="#" target="_blank" rel="noopener">عرض الموقع على الخريطة</a>
        </div>
      </section>

      <!-- Countdown -->
      <section class="section info countdown" id="countdown-section" aria-labelledby="cdTitle" data-video-scene="countdown" data-video-hold="4000">
        <img class="info__icon reveal" src="assets/icon-clock.svg" alt="" width="60" height="64">
        <h2 class="s-title reveal" id="cdTitle">العدّ التنازلي</h2>
        <p class="info__meta reveal">حتى ليلة الفرح</p>
        <div class="countdown__grid reveal" id="countdown" role="timer" aria-live="off">
          <div class="cd"><span class="cd__num" data-cd="days">0</span><span class="cd__unit">يوم</span></div>
          <div class="cd"><span class="cd__num" data-cd="hours">0</span><span class="cd__unit">ساعة</span></div>
          <div class="cd"><span class="cd__num" data-cd="minutes">0</span><span class="cd__unit">دقيقة</span></div>
          <div class="cd"><span class="cd__num" data-cd="seconds">0</span><span class="cd__unit">ثانية</span></div>
        </div>
        <p class="countdown__done" id="countdownDone" hidden></p>
      </section>

      <!-- Notes -->
      <section class="section notes" id="notesSection" data-video-scene="notes" data-video-hold="4500">
        <h2 class="s-title reveal">ملاحظات</h2>
        <ul class="notes__list reveal" data-field="notes"></ul>
      </section>

      <!-- Closing -->
      <footer class="section closing" data-video-scene="closing" data-video-hold="4500">
        <img class="flourish reveal" src="assets/flourish.svg" alt="" width="1890" height="139">
        <p class="closing__big reveal" data-field="closing"></p>
        <p class="closing__sub reveal" data-field="closingSub"></p>
        <p class="closing__names reveal">
          <span data-field="groomName"></span>
          <img class="closing__waw" src="assets/waw.webp" alt="و" width="512" height="463">
          <span data-field="brideName"></span>
        </p>
        <p class="closing__date reveal" data-field="dateShort"></p>
        <img class="flourish reveal" src="assets/flourish.svg" alt="" width="1890" height="139">

        <!-- the bottom of the Canva design: grass, pillar bases, leaves and the satin cloth
             (the cloth is its own layer, ready to be animated) -->
        <div class="ground" aria-hidden="true">
          <img class="ground__art" src="assets/bottom.webp" alt="" width="1440" height="1027" loading="lazy">
          <img class="ground__cloth" src="assets/cloth.webp" alt="" width="1463" height="763" loading="lazy">
        </div>
      </footer>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
