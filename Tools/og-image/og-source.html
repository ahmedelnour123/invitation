<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<!-- Link-preview image (og-image.jpg, 1200×630), made from the site's own art:
     the first page's curtains, flowers and pillar tops on the sides, the
     chandelier in the middle, and the names + date in the centre square
     (WhatsApp sometimes crops previews to the middle square). -->
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=Gulzar&display=swap" rel="stylesheet">
<style>
  :root {
    --s: .62px;                          /* px per Canva unit of the art */
    --art: url("../../assets/top.webp");
    --copper: #A06655;
    --red: #972726;
    --paper: #FBFBF9;
  }
  html, body { margin: 0; }
  .og {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: var(--paper);
    text-align: center;
  }
  .og::before {                         /* a soft sky wash behind the middle, like the design */
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 42% 60% at 50% 22%, rgba(214, 228, 236, .55), rgba(214, 228, 236, 0) 70%);
  }
  .side, .middle {
    position: absolute;
    top: 0;
    background-image: var(--art);
    background-repeat: no-repeat;
    background-size: calc(1080 * var(--s)) auto;
  }
  /* left: curtain, flowers, pillar top (Canva x 0–380) */
  .side--l {
    left: 0;
    width: calc(380 * var(--s));
    height: 630px;
    background-position: 0 0;
    -webkit-mask-image: linear-gradient(to left, transparent 0, #000 18%);
            mask-image: linear-gradient(to left, transparent 0, #000 18%);
  }
  /* right: the same on the other side (Canva x 700–1080) */
  .side--r {
    right: 0;
    width: calc(380 * var(--s));
    height: 630px;
    background-position: calc(-700 * var(--s)) 0;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 18%);
            mask-image: linear-gradient(to right, transparent 0, #000 18%);
  }
  /* middle: the chandelier under the garland (Canva x 240–840, y 0–400),
     melting into the paper on all three open sides */
  .middle {
    left: 50%;
    width: calc(600 * var(--s));
    height: calc(400 * var(--s));
    translate: -50% 0;
    background-position: calc(-240 * var(--s)) 0;
    -webkit-mask-image:
      linear-gradient(to right, transparent 0, #000 30%, #000 70%, transparent 100%),
      linear-gradient(to bottom, #000 55%, transparent 100%);
    -webkit-mask-composite: source-in;
            mask-image:
      linear-gradient(to right, transparent 0, #000 30%, #000 70%, transparent 100%),
      linear-gradient(to bottom, #000 55%, transparent 100%);
            mask-composite: intersect;
  }

  .content {
    position: absolute;
    left: 300px;
    right: 300px;
    top: 222px;
    bottom: 34px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .flourish { width: 300px; height: auto; display: block; }
  .flourish--down { rotate: 180deg; }
  .names {
    margin: 6px 0;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    width: 100%;
    gap: 22px;
    font-family: "Gulzar", serif;
    font-size: 118px;
    line-height: 1.3;
    color: var(--copper);
  }
  .names > :first-child { justify-self: end; }
  .names > :last-child  { justify-self: start; }
  .names img { height: 92px; width: auto; display: block; }
  .date {
    margin-top: 18px;
    display: flex;
    gap: 22px;
    font-family: "Almarai", sans-serif;
    font-size: 30px;
    color: var(--red);
  }
  .date .num { direction: ltr; letter-spacing: .3em; margin-inline-end: -.3em; }
</style>
</head>
<body>
  <div class="og">
    <div class="side side--l"></div>
    <div class="side side--r"></div>
    <div class="middle"></div>
    <div class="content">
      <img class="flourish" src="../../assets/flourish.svg" alt="">
      <p class="names"><span>خضر</span><img src="../../assets/waw.webp" alt="و"><span>أمل</span></p>
      <img class="flourish flourish--down" src="../../assets/flourish.svg" alt="">
      <p class="date"><span>الجمعة</span><span class="num">11.12.2026</span></p>
    </div>
  </div>
</body>
</html>
